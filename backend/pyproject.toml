[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dinner-dice-and-dragons-api"
version = "0.1.0"
description = "Production API for Dinner, Dice & Dragons"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.143.2",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.0",
  "pyjwt[crypto]==2.15.1",
  "sqlalchemy==2.1.4",
  "uvicorn[standard]==0.54.0",
]

[project.scripts]
app = "app.main:app"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
