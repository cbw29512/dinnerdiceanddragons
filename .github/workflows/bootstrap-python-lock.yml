name: Bootstrap Python Production Lock

on:
  push:
    branches: [agent/python-lock-and-image-scan]
    paths:
      - ".github/workflows/bootstrap-python-lock.yml"
      - "backend/pyproject.toml"

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/python-lock-and-image-scan

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned compatible lock generator
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pip==26.1
          python -m pip install --disable-pip-version-check --no-cache-dir pip-tools==7.6.0

      - name: Generate hash-locked production requirements
        run: |
          pip-compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file backend/requirements.lock \
            backend/pyproject.toml

      - name: Commit exact generated lock to bootstrap branch
        shell: bash
        run: |
          set -euo pipefail
          git add backend/requirements.lock
          if git diff --cached --quiet; then
            echo "Lock file is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock transitive Python production dependencies"
          git push origin HEAD:agent/python-lock-and-image-scan
