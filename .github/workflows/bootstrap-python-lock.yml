name: Bootstrap Python Production Lock

on:
  push:
    branches: [agent/python-lock-and-image-scan]
    paths:
      - ".github/workflows/bootstrap-python-lock.yml"
      - "backend/pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-python-lock.yml"
      - "backend/pyproject.toml"

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned compatible lock generator
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pip==26.1
          python -m pip install --disable-pip-version-check --no-cache-dir pip-tools==7.6.0

      - name: Generate hash-locked production requirements
        run: |
          mkdir -p lock-artifact
          pip-compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file lock-artifact/requirements.lock \
            backend/pyproject.toml

      - name: Upload generated lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-production-lock
          path: lock-artifact/requirements.lock
          if-no-files-found: error
          retention-days: 1
