name: API Quality Checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/site-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/site-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install production API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"

      - name: Compile production API Python
        run: python -m compileall -q backend/app backend/tests backend/alembic/env.py

      - name: Check backend shell-script syntax
        run: bash -n backend/scripts/*.sh

      - name: Lint production API with Ruff
        run: ruff check backend

      - name: Check production API formatting with Ruff
        run: ruff format --check backend

      - name: Validate Alembic revision tree
        working-directory: backend
        run: alembic -c alembic.ini heads

      - name: Test production API
        run: pytest backend/tests

  docker-smoke:
    name: Docker API and PostgreSQL health smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start development stack
        shell: bash
        run: |
          set -euo pipefail
          if ! docker compose up --build --detach; then
            docker compose ps --all || true
            docker compose logs api db || true
            exit 1
          fi

      - name: Wait for API container health
        shell: bash
        run: |
          set -euo pipefail
          api_id="$(docker compose ps --quiet api)"
          test -n "$api_id"
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$api_id")"
            echo "API health attempt ${attempt}: ${status}"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker compose logs api db
              exit 1
            fi
            sleep 2
          done
          docker compose logs api db
          exit 1

      - name: Apply production database migrations
        run: docker compose exec -T api alembic -c alembic.ini upgrade head

      - name: Verify durable identity constraints in PostgreSQL
        run: bash backend/scripts/verify_identity_schema.sh

      - name: Verify PlayerProfile persistence in PostgreSQL
        run: bash backend/scripts/verify_player_profile_schema.sh

      - name: Verify GMProfile persistence in PostgreSQL
        run: bash backend/scripts/verify_gm_profile_schema.sh

      - name: Verify Venue persistence in PostgreSQL
        run: bash backend/scripts/verify_venue_schema.sh

      - name: Verify GameSystem catalog in PostgreSQL
        run: bash backend/scripts/verify_game_system_schema.sh

      - name: Verify PlayerSystemExperience persistence in PostgreSQL
        run: bash backend/scripts/verify_player_system_experience_schema.sh

      - name: Verify GMSystemExperience persistence in PostgreSQL
        run: bash backend/scripts/verify_gm_system_experience_schema.sh

      - name: Verify RecurringAvailabilityRule persistence in PostgreSQL
        run: bash backend/scripts/verify_recurring_availability_schema.sh

      - name: Verify Player and GM availability windows in PostgreSQL
        run: bash backend/scripts/verify_availability_window_schema.sh

      - name: Verify privileged audit immutability in PostgreSQL
        run: bash backend/scripts/verify_privileged_audit_schema.sh

      - name: Verify HTTP health endpoint
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health \
            | grep '"status":"ok"'

      - name: Tear down development stack
        if: always()
        run: docker compose down --volumes --remove-orphans
