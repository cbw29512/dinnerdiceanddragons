name: Site and API Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install production API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"

      - name: Compile production API Python
        run: python -m compileall -q backend/app backend/tests backend/alembic/env.py

      - name: Check backend shell-script syntax
        run: bash -n backend/scripts/*.sh

      - name: Lint production API with Ruff
        run: ruff check backend

      - name: Check production API formatting with Ruff
        run: ruff format --check backend

      - name: Validate Alembic revision tree
        working-directory: backend
        run: alembic -c alembic.ini heads

      - name: Test production API foundation
        run: pytest backend/tests

      - name: Check HTML metadata, links, and skip-focus targets
        run: python scripts/check_site.py

      - name: Check button and interaction wiring
        run: python scripts/check_buttons.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)

      - name: Run matching and lifecycle unit tests
        run: node tests/run-tests.js

      - name: Check Apps Script syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            cp "$file" /tmp/ddd-apps-script-check.js
            node --check /tmp/ddd-apps-script-check.js
          done < <(find apps-script -type f -name '*.gs' -print0)

  docker-smoke:
    name: Docker API and PostgreSQL health smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start development stack
        shell: bash
        run: |
          set -euo pipefail
          if ! docker compose up --build --detach; then
            docker compose ps --all || true
            docker compose logs api db || true
            exit 1
          fi

      - name: Wait for API container health
        shell: bash
        run: |
          set -euo pipefail
          api_id="$(docker compose ps --quiet api)"
          if [[ -z "$api_id" ]]; then
            docker compose ps
            docker compose logs api
            exit 1
          fi

          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$api_id")"
            echo "API health attempt ${attempt}: ${status}"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker compose ps
              docker compose logs api db
              exit 1
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs api db
          echo "API did not become healthy in the expected window."
          exit 1

      - name: Apply production database migrations
        run: docker compose exec -T api alembic -c alembic.ini upgrade head

      - name: Verify durable identity constraints in PostgreSQL
        run: bash backend/scripts/verify_identity_schema.sh

      - name: Verify PlayerProfile persistence in PostgreSQL
        run: bash backend/scripts/verify_player_profile_schema.sh

      - name: Verify GMProfile persistence in PostgreSQL
        run: bash backend/scripts/verify_gm_profile_schema.sh

      - name: Verify Venue persistence in PostgreSQL
        run: bash backend/scripts/verify_venue_schema.sh

      - name: Verify GameSystem catalog in PostgreSQL
        run: bash backend/scripts/verify_game_system_schema.sh

      - name: Verify PlayerSystemExperience persistence in PostgreSQL
        run: bash backend/scripts/verify_player_system_experience_schema.sh

      - name: Verify privileged audit immutability in PostgreSQL
        run: bash backend/scripts/verify_privileged_audit_schema.sh

      - name: Verify HTTP health endpoint
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health \
            | grep '"status":"ok"'

      - name: Show healthy stack
        run: docker compose ps

      - name: Tear down development stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  supabase-auth-smoke:
    name: Local Supabase Auth development smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install production API auth dependencies
        run: python -m pip install -e ./backend

      - name: Verify pinned Supabase CLI
        run: npx --yes supabase@2.110.0 --version

      - name: Start local Supabase Auth stack
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.110.0 start \
            -x realtime,storage-api,imgproxy,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Verify local Supabase Auth health and configuration
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx --yes supabase@2.110.0 status -o env)"
          test -n "${ANON_KEY:-}"

          curl --fail --silent --show-error \
            -H "apikey: ${ANON_KEY}" \
            http://127.0.0.1:54321/auth/v1/health \
            > /tmp/supabase-auth-health.json

          curl --fail --silent --show-error \
            -H "apikey: ${ANON_KEY}" \
            http://127.0.0.1:54321/auth/v1/settings \
            > /tmp/supabase-auth-settings.json

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/supabase-auth-health.json').read_text())
          settings = json.loads(Path('/tmp/supabase-auth-settings.json').read_text())
          external = settings.get('external', {})

          assert health.get('name') == 'GoTrue', health
          assert settings.get('disable_signup') is False, settings
          assert settings.get('mailer_autoconfirm') is False, settings
          assert external.get('email') is True, settings
          assert external.get('anonymous_users') is False, settings
          print('Local Supabase Auth health/config verification passed.')
          PY

      - name: Prove unverified email cannot authenticate
        run: bash backend/scripts/verify_supabase_email_confirmation.sh

      - name: Verify confirmed user token through live Supabase JWKS
        run: bash backend/scripts/verify_supabase_jwks_token.sh

      - name: Verify two authenticated users remain isolated
        run: bash backend/scripts/verify_two_user_authorization.sh

      - name: Stop and reset local Supabase Auth
        if: always()
        run: npx --yes supabase@2.110.0 stop --no-backup || true

  browser-smoke:
    name: Browser, accessibility, reflow, and runtime tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Python for local site server
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install locked browser test dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run functional, keyboard, WCAG, reflow, and runtime tests
        run: npm run test:e2e

  lighthouse:
    name: Lighthouse performance, SEO, and best-practices gate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pinned Lighthouse CI
        run: npm install --global @lhci/cli@0.15.1

      - name: Collect Lighthouse reports
        run: lhci collect --config=lighthouserc.cjs

      - name: Enforce Lighthouse thresholds
        run: lhci assert --config=lighthouserc.cjs

      - name: Preserve Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
