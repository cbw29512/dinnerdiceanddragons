name: Static Site Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check HTML metadata, links, and skip-focus targets
        run: python scripts/check_site.py

      - name: Check button and interaction wiring
        run: python scripts/check_buttons.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)

      - name: Run matching and lifecycle unit tests
        run: node tests/run-tests.js

      - name: Check Apps Script syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            cp "$file" /tmp/ddd-apps-script-check.js
            node --check /tmp/ddd-apps-script-check.js
          done < <(find apps-script -type f -name '*.gs' -print0)

  browser-smoke:
    name: Browser, accessibility, and reflow tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Set up Python for local site server
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install browser test dependencies
        run: npm install

      - name: Emit generated lockfile
        run: node -e "process.stdout.write('DDD_LOCKFILE_BASE64=' + require('fs').readFileSync('package-lock.json').toString('base64') + '\n')"

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run functional, keyboard, WCAG, and 320px reflow tests
        run: npm run test:e2e
