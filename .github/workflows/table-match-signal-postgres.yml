  push:
    branches: [main]
    paths:
      - "backend/app/models/**"
      - "backend/app/api/rate_limit.py"
      - "backend/app/api/routes/events.py"
      - "backend/app/api/routes/game_hub.py"
      - "backend/app/api/routes/table_formation.py"
      - "backend/app/api/routes/table_match_opportunities.py"
      - "backend/app/api/routes/venue_bookings.py"
      - "backend/app/schemas/game_hub.py"
      - "backend/app/services/api_rate_limit_*.py"
      - "backend/app/services/geo_distance.py"
      - "backend/app/services/geocodio_postal_resolver.py"
      - "backend/app/services/postal_centroid*.py"
      - "backend/app/services/postal_centroids.py"
      - "backend/app/services/table_match_*.py"
      - "backend/app/services/table_formation_*.py"
      - "backend/app/services/event_*.py"
      - "backend/app/services/*registration*.py"
      - "backend/app/services/venue_booking_*.py"
      - "backend/app/services/game_hub_*.py"
      - "backend/app/services/message_cursor.py"
      - "backend/alembic/**"
      - "backend/scripts/verify_api_rate_limit_schema.sh"
      - "backend/scripts/verify_table_match_signal_schema.sh"
      - "backend/scripts/verify_postal_centroid_schema.sh"
      - "backend/scripts/verify_table_formation_schema.sh"
      - "backend/scripts/verify_game_hub_schema.sh"
      - "backend/tests/test_api_rate_limits.py"
      - "backend/tests/api_rate_limit_postgres_contract.py"
      - "backend/tests/test_geo_distance.py"
      - "backend/tests/test_geocodio_postal_resolver.py"
      - "backend/tests/test_postal_centroid_cache.py"
      - "backend/tests/test_table_match_*.py"
      - "backend/tests/test_table_formation_*.py"
      - "backend/tests/test_registration_lifecycle.py"
      - "backend/tests/test_venue_booking_capacity.py"
      - "backend/tests/test_game_hub_*.py"
      - "backend/tests/table_formation_postgres_contract.py"
      - ".github/workflows/table-match-signal-postgres.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/app/models/**"
      - "backend/app/api/rate_limit.py"
      - "backend/app/api/routes/events.py"
      - "backend/app/api/routes/game_hub.py"
      - "backend/app/api/routes/table_formation.py"
      - "backend/app/api/routes/table_match_opportunities.py"
      - "backend/app/api/routes/venue_bookings.py"
      - "backend/app/schemas/game_hub.py"
      - "backend/app/services/api_rate_limit_*.py"
      - "backend/app/services/geo_distance.py"
      - "backend/app/services/geocodio_postal_resolver.py"
      - "backend/app/services/postal_centroid*.py"
      - "backend/app/services/postal_centroids.py"
      - "backend/app/services/table_match_*.py"
      - "backend/app/services/table_formation_*.py"
      - "backend/app/services/event_*.py"
      - "backend/app/services/*registration*.py"
      - "backend/app/services/venue_booking_*.py"
      - "backend/app/services/game_hub_*.py"
      - "backend/app/services/message_cursor.py"
      - "backend/alembic/**"
      - "backend/scripts/verify_api_rate_limit_schema.sh"
      - "backend/scripts/verify_table_match_signal_schema.sh"
      - "backend/scripts/verify_postal_centroid_schema.sh"
      - "backend/scripts/verify_table_formation_schema.sh"
      - "backend/scripts/verify_game_hub_schema.sh"
      - "backend/tests/test_api_rate_limits.py"
      - "backend/tests/api_rate_limit_postgres_contract.py"
      - "backend/tests/test_geo_distance.py"
      - "backend/tests/test_geocodio_postal_resolver.py"
      - "backend/tests/test_postal_centroid_cache.py"
      - "backend/tests/test_table_match_*.py"
      - "backend/tests/test_table_formation_*.py"
      - "backend/tests/test_registration_lifecycle.py"
      - "backend/tests/test_venue_booking_capacity.py"
      - "backend/tests/test_game_hub_*.py"
      - "backend/tests/table_formation_postgres_contract.py"
      - ".github/workflows/table-match-signal-postgres.yml"

permissions:
  contents: read

jobs:
  matching-formation-hub-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start PostgreSQL API stack
        shell: bash
        run: |
          set -euo pipefail
          if ! docker compose up --build --detach; then
            docker compose ps --all || true
            docker compose logs api db || true
            exit 1
          fi

      - name: Wait for API health
        shell: bash
        run: |
          set -euo pipefail
          api_id="$(docker compose ps --quiet api)"
          test -n "$api_id"

          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$api_id")"
            echo "API health attempt ${attempt}: ${status}"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker compose logs api db
              exit 1
            fi
            sleep 2
          done

          docker compose logs api db
          echo "API did not become healthy in the expected window."
          exit 1

      - name: Apply migrations through live Game Hub
        run: docker compose exec -T api alembic -c alembic.ini upgrade head

      - name: Verify distributed API rate-limit persistence in PostgreSQL
        run: bash backend/scripts/verify_api_rate_limit_schema.sh

      - name: Verify Table Match persistence in PostgreSQL
        run: bash backend/scripts/verify_table_match_signal_schema.sh

      - name: Verify postal centroid cache in PostgreSQL
        run: bash backend/scripts/verify_postal_centroid_schema.sh

      - name: Verify table formation persistence in PostgreSQL
        run: bash backend/scripts/verify_table_formation_schema.sh

      - name: Verify live Game Hub message persistence in PostgreSQL
        run: bash backend/scripts/verify_game_hub_schema.sh

      - name: Verify table formation concurrency in PostgreSQL
        run: docker compose exec -T api python - < backend/tests/table_formation_postgres_contract.py

      - name: Verify distributed API rate-limit concurrency in PostgreSQL
        run: docker compose exec -T api python - < backend/tests/api_rate_limit_postgres_contract.py

      - name: Tear down contract stack
        if: always()
        run: docker compose down --volumes --remove-orphans
