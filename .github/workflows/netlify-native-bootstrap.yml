name: Bootstrap Netlify Native Stack

on:
  push:
    branches: [agent/netlify-native-stack-bootstrap5]
    paths:
      - ".github/workflows/netlify-native-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/netlify-native-stack-bootstrap5

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Pin Netlify runtime dependencies
        run: npm install --save-exact @netlify/database @netlify/identity

      - name: Install locked backend migration dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock

      - name: Generate Netlify PostgreSQL baseline from Alembic
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+psycopg://ddd:ddd@localhost:5432/ddd
        run: |
          mkdir -p netlify/database/migrations
          cd backend
          alembic upgrade head --sql > ../netlify/database/migrations/0001_initial_schema.sql
          cat >> ../netlify/database/migrations/0001_initial_schema.sql <<'SQL'

          INSERT INTO game_systems (id, name, edition, slug, publisher_name, active) VALUES
            ('10000000-0000-0000-0000-000000000001', 'Dungeons & Dragons', '5e (2014)', 'dnd-5e-2014', NULL, true),
            ('10000000-0000-0000-0000-000000000002', 'Dungeons & Dragons', '5e (2024)', 'dnd-5e-2024', NULL, true),
            ('10000000-0000-0000-0000-000000000003', 'Pathfinder', '2e', 'pathfinder-2e', NULL, true),
            ('10000000-0000-0000-0000-000000000004', 'Call of Cthulhu', NULL, 'call-of-cthulhu', NULL, true),
            ('10000000-0000-0000-0000-000000000005', 'Cyberpunk RED', NULL, 'cyberpunk-red', NULL, true),
            ('10000000-0000-0000-0000-000000000006', 'Shadowrun', NULL, 'shadowrun', NULL, true),
            ('10000000-0000-0000-0000-000000000007', 'Other RPG', NULL, 'other-rpg', NULL, true)
          ON CONFLICT (id) DO NOTHING;
          SQL

      - name: Reject Supabase-specific SQL in Netlify baseline
        run: |
          if grep -Eqi 'auth\.uid\(|service_role|supabase' netlify/database/migrations/0001_initial_schema.sql; then
            echo "Generated baseline contains Supabase-specific SQL" >&2
            exit 1
          fi

      - name: Commit generated lockfile and migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json netlify/database/migrations/0001_initial_schema.sql
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Bootstrap Netlify Database and Identity"
          git push origin HEAD:agent/netlify-native-stack-bootstrap5
