name: Frontend Quality Checks

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "css/**"
      - "js/**"
      - "e2e/**"
      - "scripts/check_site.py"
      - "scripts/check_buttons.py"
      - "tests/**"
      - "apps-script/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - "lighthouserc.cjs"
      - ".github/workflows/frontend-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "css/**"
      - "js/**"
      - "e2e/**"
      - "scripts/check_site.py"
      - "scripts/check_buttons.py"
      - "tests/**"
      - "apps-script/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - "lighthouserc.cjs"
      - ".github/workflows/frontend-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check HTML metadata, links, and skip-focus targets
        run: python scripts/check_site.py

      - name: Check button and interaction wiring
        run: python scripts/check_buttons.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)

      - name: Run matching and lifecycle JavaScript tests
        run: node tests/run-tests.js

      - name: Check Apps Script syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            cp "$file" /tmp/ddd-apps-script-check.js
            node --check /tmp/ddd-apps-script-check.js
          done < <(find apps-script -type f -name '*.gs' -print0)

  browser-smoke:
    name: Browser, accessibility, reflow, and runtime tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Python for local site server
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install locked browser test dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run functional, keyboard, WCAG, reflow, and runtime tests
        run: npm run test:e2e

      - name: Preserve Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-report
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  lighthouse:
    name: Lighthouse performance, SEO, and best-practices gate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pinned Lighthouse CI
        run: npm install --global @lhci/cli@0.15.1

      - name: Collect Lighthouse reports
        run: lhci collect --config=lighthouserc.cjs

      - name: Enforce Lighthouse thresholds
        run: lhci assert --config=lighthouserc.cjs

      - name: Preserve Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
