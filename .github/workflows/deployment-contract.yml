name: Production Deployment Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  netlify-production-contract:
    name: Netlify native production contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ddd
          POSTGRES_PASSWORD: ddd
          POSTGRES_DB: ddd_contract
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U ddd -d ddd_contract"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked Netlify runtime dependencies
        run: npm ci
      - name: Build Netlify production artifact
        env:
          URL: https://ddd-contract.netlify.app
        run: node scripts/build-netlify.mjs
      - name: Verify Netlify package boundary and native runtime
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            netlify.toml netlify/functions/api.mjs netlify/functions/auth-api.mjs \
            netlify/functions/_lib/database.mjs netlify/database/migrations/0001_initial_schema.sql \
            netlify/database/migrations/0002_privacy_notifications.sql netlify/database/migrations/0003_game_reminders.sql \
            dist/index.html dist/play.html dist/dm.html dist/host.html dist/signin.html dist/my-ddd.html \
            dist/notifications.html dist/opportunity.html dist/create-game.html dist/game-hub.html \
            dist/player-start.js dist/player-start-profile.js dist/dm-start.js dist/dm-start-profile.js \
            dist/host-start.js dist/host-start-account.js dist/host-managed-venues.js dist/auth-confirm.js \
            dist/my-ddd-games.js dist/my-ddd-reminders.js dist/venue-window-payloads.js \
            dist/availability-calendar-init.mjs dist/availability-presets.mjs \
            dist/calendar-state.mjs dist/calendar-ui.mjs dist/production-auth.js dist/sitemap.xml dist/robots.txt; do
            test -f "$file"
          done
          for forbidden in dist/backend dist/.github dist/e2e dist/tests dist/supabase dist/apps-script \
            dist/dashboard-prototype.html dist/game-hub-messages.js; do
            test ! -e "$forbidden"
          done
          grep -q 'apiBaseUrl: window.location.origin' dist/production-config.js
          grep -q '/auth-api/v1/auth/' dist/production-auth.js
          grep -q 'https://ddd-contract.netlify.app' dist/sitemap.xml
          grep -q 'Sitemap: https://ddd-contract.netlify.app/sitemap.xml' dist/robots.txt
          grep -q '"@netlify/database"' package.json
          grep -q '"@netlify/identity"' package.json
          ! grep -q 'private_residence' dist/host.html dist/host-start.js
          ! grep -q 'getHubMessages\|postHubMessage\|/messages"' dist/production-api-client.js
          ! grep -q 'game-hub-messages.js\|message-channel-grid\|venue-question-form' dist/game-hub.html
          if grep -R -n -E 'dinnerdiceanddragons\.vercel\.app|supabase\.co|sb_publishable_|SUPABASE_SECRET_KEY|DDD_API_ORIGIN' dist netlify/functions production-auth.js production-config.js netlify.toml; then
            echo "Legacy external production provider leaked into Netlify-native runtime."
            exit 1
          fi
          node --check scripts/build-netlify.mjs
          node --check scripts/netlify-ignore.mjs
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find netlify/functions -type f -name '*.mjs' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -maxdepth 1 -type f -name '*.mjs' -print0)
          node -e "Promise.all([import('./netlify/functions/api.mjs'), import('./netlify/functions/auth-api.mjs')]).then(([api, auth]) => { if (typeof api.default !== 'function' || api.config?.path !== '/api/*' || typeof auth.default !== 'function' || auth.config?.path !== '/auth-api/*') process.exit(1); })"
      - name: Apply and verify Netlify Database migrations
        env:
          PGPASSWORD: ddd
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ddd -d ddd_contract -f netlify/database/migrations/0001_initial_schema.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ddd -d ddd_contract -f netlify/database/migrations/0002_privacy_notifications.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ddd -d ddd_contract -f netlify/database/migrations/0003_game_reminders.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ddd -d ddd_contract <<'SQL'
          DO $$
          BEGIN
            IF (SELECT version_num FROM alembic_version) <> '0022_signal_availability' THEN RAISE EXCEPTION 'Unexpected migration head'; END IF;
            IF (SELECT count(*) FROM game_systems WHERE active IS TRUE) <> 7 THEN RAISE EXCEPTION 'Expected 7 active game systems'; END IF;
            IF to_regclass('public.events') IS NULL OR to_regclass('public.notification_preferences') IS NULL OR to_regclass('public.opportunity_responses') IS NULL OR to_regclass('public.notifications') IS NULL THEN
              RAISE EXCEPTION 'Required lifecycle/privacy tables are missing';
            END IF;
            IF to_regclass('public.game_reminders') IS NULL THEN RAISE EXCEPTION 'game_reminders is missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'notification_preferences' AND column_name = 'default_reminder_minutes'
            ) THEN RAISE EXCEPTION 'default_reminder_minutes is missing'; END IF;
          END
          $$;
          SQL
      - name: Run native Netlify API contract tests
        run: |
          node tests/netlify-api-contract-tests.mjs
          node tests/privacy-matching-tests.mjs
          node tests/notification-delivery-contract-tests.mjs
          node tests/production-api-client-tests.js

  netlify-deploy-preview-smoke:
    name: Live Netlify deploy-preview smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed app, database health, Identity JSON, and privacy boundary
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--dinnerdiceanddragons.netlify.app
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 24 --retry-delay 10 --retry-all-errors "$PREVIEW_URL/" -o /tmp/home.html
          for asset in play.html dm.html host.html signin.html my-ddd.html notifications.html opportunity.html create-game.html game-hub.html \
            player-start.js player-start-profile.js dm-start.js dm-start-profile.js \
            host-start.js host-start-account.js host-managed-venues.js auth-confirm.js \
            my-ddd-games.js my-ddd-reminders.js venue-window-payloads.js availability-presets.mjs \
            production-config.js production-auth.js availability-calendar-init.mjs calendar-state.mjs calendar-ui.mjs; do
            curl --fail --silent --show-error --location "$PREVIEW_URL/$asset" -o "/tmp/${asset//\//_}"
          done
          grep -q 'apiBaseUrl: window.location.origin' /tmp/production-config.js
          grep -q '/auth-api/v1/auth/' /tmp/production-auth.js
          grep -q 'What do you want to do?' /tmp/home.html
          grep -q 'DDDHostStartAccount' /tmp/host-start-account.js
          grep -q 'DDDHostManagedVenues' /tmp/host-managed-venues.js
          ! grep -q 'private_residence' /tmp/host.html /tmp/host-start.js
          ! grep -q 'game-hub-messages.js\|message-channel-grid\|venue-question-form' /tmp/game-hub.html

          curl --fail --silent --show-error "$PREVIEW_URL/api/v1/health" -o /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(h.status!=='ok'||h.runtime!=='netlify-functions'||h.database!=='netlify-database'||h.identity!=='netlify-identity') process.exit(1)"
          curl --fail --silent --show-error "$PREVIEW_URL/auth-api/v1/auth/session" -o /tmp/auth-session.json
          node -e "const s=require('/tmp/auth-session.json'); if(s.authenticated!==false) process.exit(1)"

          login_status="$(curl --silent --show-error --output /tmp/bad-login.json --write-out '%{http_code}' \
            -H 'content-type: application/json' -d '{"email":"not-an-email","password":"x"}' \
            "$PREVIEW_URL/auth-api/v1/auth/login")"
          [[ "$login_status" =~ ^4[0-9][0-9]$ ]]
          node -e "JSON.parse(require('node:fs').readFileSync('/tmp/bad-login.json','utf8'))"

          status="$(curl --silent --show-error --output /tmp/me.json --write-out '%{http_code}' "$PREVIEW_URL/api/v1/me")"
          [[ "$status" == "401" || "$status" == "403" ]]
          message_status="$(curl --silent --show-error --output /tmp/messages.json --write-out '%{http_code}' "$PREVIEW_URL/api/v1/events/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/messages")"
          [[ "$message_status" == "401" || "$message_status" == "403" || "$message_status" == "404" ]]

          curl --silent --show-error --head "$PREVIEW_URL/" | tr -d '\r' > /tmp/headers.txt
          grep -qi '^x-frame-options: DENY$' /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff$' /tmp/headers.txt
          grep -qi '^referrer-policy: strict-origin-when-cross-origin$' /tmp/headers.txt
          grep -qi '^content-security-policy:' /tmp/headers.txt
          echo "Live Netlify preview smoke passed: $PREVIEW_URL"