services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ddd
      POSTGRES_USER: ddd
      POSTGRES_PASSWORD: ddd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - ddd-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://ddd:ddd@db:5432/ddd
      SUPABASE_JWT_AUDIENCE: authenticated
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  ddd-postgres-data:
